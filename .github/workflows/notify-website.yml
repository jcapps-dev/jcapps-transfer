name: Notify website on release

on:
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to jcapps-web
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.JCAPPS_WEB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'jcapps-dev',
              repo: 'jcapps-web',
              event_type: 'transfer_release',
              client_payload: { version: context.payload.release.tag_name }
            });
